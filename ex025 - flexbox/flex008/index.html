<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container{
            display: flex;
            background-color: lightsalmon;
            flex-flow: row wrap;
            height: 400px;
            align-items: flex-start;
        }
        div.item{
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }
        div.i1{
            align-self: auto;            
        }
        div.i2{
            align-self: flex-start; 
        }
        div.i3{
            align-self: flex-end;
        }
        div.i4{
            
        }
        div.i5{
            align-self: center;            
        }
        div.i6{
            
        }
        div.i7{
            align-self: stretch;           
        }
        /*i7-i2-i1-i6-i5-i3-i4*/

    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" style="order: -3;" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" style="order: 1;" id="i6">F</div>
        <div class="item" id="i7">G</div>

    </div>
    
</body>
</html>
