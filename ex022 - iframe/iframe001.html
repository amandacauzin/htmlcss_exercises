<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <!--css é soberano, define as dimensões sobre o html-->
    <style>
        
        iframe{
            width: 500px;
            height: 500px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
   <!-- <p>Acessando o site do <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a> para aprender a programar</p> -->
    <p>Acessando o site do 
        <iframe src="https://www.cursoemvideo.com" frameborder="0">
            <a href="https://www.cursoemvideo.com" target="_blank">curso em video</a>
        </iframe>
        para aprender a programar.
    </p>
    <p>o site do 
    <!--Tamanho padrão é de 300x150px (larguraxaltura)-->
        
    <iframe src="https://www.google.com.br" frameborder="0" height="500" scrolling="no">
        <a href="https://www.google.com.br" target="_blank">google</a>
    </iframe> 
    
    também é muito legal, pena que não funciona dentro do iframe</p> <!--existe em uma proteção em alguns sites como no google-->
    
    <!-- iframe é um quadro na mesma linha da escrita-->

    <p>O repositório do Granabara 
    <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500">
        <a href="https://gustavoguanabara.github.io" target="_blank">repositório</a>
    </iframe>
        também é bem legal.</p>
</body>
</html>
